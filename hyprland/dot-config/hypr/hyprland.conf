#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound toSUPER + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


##########################
### Keyboard and mouse ###
##########################

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = true # activate windows by hover (or not)

    sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }


###################
### Keybindings ###
###################

# See https://wiki.hypr.land/Configuring/Binds/

# Close window
bind = SUPER, Q, killactive, 

# Terminal
bind = SUPER, Return, exec, uwsm-app -- kitty

# Rofi (configure in ~/.config/rofi)
bind = ALT, Space, exec, rofi -show "combi" -combi-modes "window,drun,ssh"

# Calculator with rofi
bind = ALT, C, exec, rofi -show "calc" -modes "calc" -no-show-match -no-sort

# Alt + Tab with rofi
bindn = ALT, Tab, exec, \
    rofi -show "window" -modes "window" \
    -kb-cancel "Alt+Escape,Escape" \
    -kb-accept-entry "!Alt+Tab,Return" \
    -kb-row-down "Alt+Tab,Alt+Down" \
    -kb-row-up "Alt+Shift+Tab,Alt+ISO_Left_Tab,Alt+Up"

# Common programs
bind = SUPER, E, exec, uwsm-app -- org.kde.dolphin.desktop
bind = SUPER, B, exec, uwsm-app -- brave-browser.desktop
bind = SUPER, O, exec, uwsm-app -- obsidian.desktop

# Screenshot using hyprshot and swappy
bind = SUPER SHIFT, S, exec, $hyprshot --freeze --mode=region --raw --clipboard-only | swappy -f -

# Window management
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, F, fullscreen,
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo, # keep floating size tiled (dwindle mode)
bind = SUPER, J, layoutmsg, togglesplit # toggle vertical/horizontal split (dwindle)
bind = SUPER, K, layoutmsg, swapsplit # swap vertical/horizontal (dwindle)
bind = SUPER, L, layoutmsg, movetoroot # move to root of workspace tree (dwindle)

# Move/resize windows with SUPER + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Switch workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace
bind = SUPER CTRL, 1, movetoworkspace, 1
bind = SUPER CTRL, 2, movetoworkspace, 2
bind = SUPER CTRL, 3, movetoworkspace, 3
bind = SUPER CTRL, 4, movetoworkspace, 4
bind = SUPER CTRL, 5, movetoworkspace, 5
bind = SUPER CTRL, 6, movetoworkspace, 6
bind = SUPER CTRL, 7, movetoworkspace, 7
bind = SUPER CTRL, 8, movetoworkspace, 8
bind = SUPER CTRL, 9, movetoworkspace, 9
bind = SUPER CTRL, 0, movetoworkspace, 10

# Special workspace (scratchpad)
# bind = SUPER, S, togglespecialworkspace, magic
# bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces withSUPER + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Multimedia keys for volume and LCD brightness
$SET_VOL_SOUND = /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && paplay $SET_VOL_SOUND
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && paplay $SET_VOL_SOUND
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && paplay $SET_VOL_SOUND
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

########################################
### Layers, windows, workspace rules ###
########################################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Blur background behind transparent parts of layers
# e.g. waybar and rofi are layers, not windows
layerrule {
    name = transparent-layer-blur
    match:namespace = (rofi)
    blur = on
    ignore_alpha = 0
}

# Ignore maximize requests from all apps
# To do: add exceptions for games
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

